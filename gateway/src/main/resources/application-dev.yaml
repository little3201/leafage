spring:
  security:
    oauth2:
      client:
        registration:
          web-client:
            provider: spring
            client-id: web-client
            client-secret: secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
            client-name: web-client
        provider:
          spring:
            issuer-uri: http://192.168.0.111:8761

app:
  base-uri: http://192.168.0.111:5173

logging:
  level:
    org.springframework.web.servlet.function.support: TRACE
    org.springframework.web.servlet.handler: TRACE
    org.springframework.cloud.gateway.server.mvc: TRACE
server:
  servlet:
    session:
      cookie:
        name: GATEWAY_SESSION
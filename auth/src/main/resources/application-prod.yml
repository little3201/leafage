spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      authorizationserver:
        issuer: http://${AUTH_SERVER}

logging:
  file:
    name: logs/${spring.application.name}.log